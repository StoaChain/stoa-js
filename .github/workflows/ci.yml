name: Build & Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Typecheck + Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install (not npm ci) while local npm and CI npm versions differ;
        # tighten to npm ci once environments align (see OuronetUI v0.28.5 rationale).
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      # ORDER: typecheck → build → test. Build MUST precede test, matching
      # publish.yml. kadena-stoic-legacy's tests and stoa-core's tests resolve
      # `@stoachain/kadena-stoic-legacy/*` through Node's standard module
      # resolution (no vitest resolve.alias for it — the vendored CJS source
      # layout is incompatible with vitest's transform layer; see
      # packages/stoa-core/vitest.config.ts). Resolution flows through that
      # package's `exports` map into `dist/`, so on a fresh CI checkout, where
      # `dist/` does not exist, running tests first fails with
      # ERR_MODULE_NOT_FOUND / ENOENT rather than a real assertion failure.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
